name: Skill smoke check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install OpenSpec
        id: openspec-setup
        run: npm install --global @fission-ai/openspec@2.2.0
      - run: ./tests/smoke.ps1
        shell: pwsh
      - name: Validate OpenSpec specs and active changes
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && steps.openspec-setup.outcome == 'success' }}
        run: openspec validate --all --strict --no-interactive
      - name: Validate archived OpenSpec tasks
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && steps.openspec-setup.outcome == 'success' }}
        run: openspec validate --archived
